[project]
name = "operon-tool-github"
version = "0.1.0"
description = "Operon tool — GitHub operations via gh CLI (issues, PRs, releases, CI)"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
]

[project.entry-points."operon.tools"]
github = "operon_tool_github:GitHubTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
