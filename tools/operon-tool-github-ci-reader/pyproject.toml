[project]
name = "operon-tool-github-ci-reader"
version = "0.1.0"
description = "Operon tool — read GitHub CI/CD workflow runs"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
    "operon-tool-github-base>=0.1.0",
]

[project.entry-points."operon.tools"]
github-ci-reader = "operon_tool_github_ci_reader:GitHubCiReaderTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
