[project]
name = "operon-tool-github-release-reader"
version = "0.1.0"
description = "Operon tool — read GitHub releases"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
    "operon-tool-github-base>=0.1.0",
]

[project.entry-points."operon.tools"]
github-release-reader = "operon_tool_github_release_reader:GitHubReleaseReaderTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
