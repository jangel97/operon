[project]
name = "operon-tool-github-issue-manager"
version = "0.1.0"
description = "Operon tool — create, close, and reopen GitHub issues"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
    "operon-tool-github-base>=0.1.0",
]

[project.entry-points."operon.tools"]
github-issue-manager = "operon_tool_github_issue_manager:GitHubIssueManagerTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
