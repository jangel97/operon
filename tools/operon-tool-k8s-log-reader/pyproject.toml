[project]
name = "operon-tool-k8s-log-reader"
version = "0.1.0"
description = "Operon tool — read Kubernetes pod logs"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
    "operon-tool-k8s-base>=0.1.0",
]

[project.entry-points."operon.tools"]
k8s-log-reader = "operon_tool_k8s_log_reader:K8sLogReaderTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
