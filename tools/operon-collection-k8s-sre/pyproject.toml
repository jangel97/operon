[project]
name = "operon-collection-k8s-sre"
version = "0.1.0"
description = "Operon collection — Kubernetes SRE tools (readonly + restarter + pod-deleter)"
requires-python = ">=3.11"
dependencies = [
    "operon-collection-k8s-readonly>=0.1.0",
    "operon-tool-k8s-restarter>=0.1.0",
    "operon-tool-k8s-pod-deleter>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
