[project]
name = "operon-tool-github-labeler"
version = "0.1.0"
description = "Operon tool — add and remove GitHub labels"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
    "operon-tool-github-base>=0.1.0",
]

[project.entry-points."operon.tools"]
github-labeler = "operon_tool_github_labeler:GitHubLabelerTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
