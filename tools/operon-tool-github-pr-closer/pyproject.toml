[project]
name = "operon-tool-github-pr-closer"
version = "0.1.0"
description = "Operon tool — close GitHub pull requests"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
    "operon-tool-github-base>=0.1.0",
]

[project.entry-points."operon.tools"]
github-pr-closer = "operon_tool_github_pr_closer:GitHubPrCloserTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
