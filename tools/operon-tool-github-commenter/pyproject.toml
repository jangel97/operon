[project]
name = "operon-tool-github-commenter"
version = "0.1.0"
description = "Operon tool — comment on GitHub issues and pull requests"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
    "operon-tool-github-base>=0.1.0",
]

[project.entry-points."operon.tools"]
github-commenter = "operon_tool_github_commenter:GitHubCommenterTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
