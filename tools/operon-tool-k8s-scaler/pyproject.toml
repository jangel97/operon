[project]
name = "operon-tool-k8s-scaler"
version = "0.1.0"
description = "Operon tool — scale Kubernetes deployments"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
    "operon-tool-k8s-base>=0.1.0",
]

[project.entry-points."operon.tools"]
k8s-scaler = "operon_tool_k8s_scaler:K8sScalerTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
