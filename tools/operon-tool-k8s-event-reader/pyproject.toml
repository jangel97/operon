[project]
name = "operon-tool-k8s-event-reader"
version = "0.1.0"
description = "Operon tool — read Kubernetes cluster events"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
    "operon-tool-k8s-base>=0.1.0",
]

[project.entry-points."operon.tools"]
k8s-event-reader = "operon_tool_k8s_event_reader:K8sEventReaderTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
