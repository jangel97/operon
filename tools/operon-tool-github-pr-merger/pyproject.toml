[project]
name = "operon-tool-github-pr-merger"
version = "0.1.0"
description = "Operon tool — merge GitHub pull requests"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
    "operon-tool-github-base>=0.1.0",
]

[project.entry-points."operon.tools"]
github-pr-merger = "operon_tool_github_pr_merger:GitHubPrMergerTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
