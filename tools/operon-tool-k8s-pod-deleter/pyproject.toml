[project]
name = "operon-tool-k8s-pod-deleter"
version = "0.1.0"
description = "Operon tool — delete Kubernetes pods (recreated by controller)"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
    "operon-tool-k8s-base>=0.1.0",
]

[project.entry-points."operon.tools"]
k8s-pod-deleter = "operon_tool_k8s_pod_deleter:K8sPodDeleterTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
