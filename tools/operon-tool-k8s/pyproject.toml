[project]
name = "operon-tool-k8s"
version = "0.1.0"
description = "Operon tool — Kubernetes actions (mock for MVP)"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
]

[project.entry-points."operon.tools"]
k8s = "operon_tool_k8s:MockKubernetesTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
