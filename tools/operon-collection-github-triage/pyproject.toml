[project]
name = "operon-collection-github-triage"
version = "0.1.0"
description = "Operon collection — GitHub triage tools (readonly + labeler + commenter)"
requires-python = ">=3.11"
dependencies = [
    "operon-collection-github-readonly>=0.1.0",
    "operon-tool-github-labeler>=0.1.0",
    "operon-tool-github-commenter>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
