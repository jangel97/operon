[project]
name = "council-tools"
version = "0.1.0"
description = "Custom tools for the Council of the Wise demo"
requires-python = ">=3.11"
dependencies = [
    "operon>=0.1.0",
    "requests>=2.28",
    "jinja2>=3.1",
]

[project.entry-points."operon.tools"]
council = "council_tools:CouncilTool"
respond = "council_tools:RespondTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
