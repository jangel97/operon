name: opentdb
runtime: python
entrypoint: main.py
actions:
  - name: get_question
    type: read
    description: Fetch a trivia question from Open Trivia Database
    params:
      difficulty:
        type: string
        default: medium
  - name: answer_question
    type: read
    description: Submit an answer to the current trivia question
    params:
      answer:
        type: string
        required: true
