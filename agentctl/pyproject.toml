[project]
name = "operon"
version = "0.1.0"
description = "Agentic Automation Platform — define goals, execute with control"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "rich>=13.0",
]

[project.scripts]
agentctl = "operon.cli.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]
serve = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
