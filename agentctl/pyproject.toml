[project]
name = "operon"
version = "0.1.0"
description = "Agentic Automation Platform — define goals, execute with control"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "rich>=13.0",
]

[project.scripts]
agentctl = "operon.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
