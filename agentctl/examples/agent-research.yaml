apiVersion: agents/v1
kind: Agent

metadata:
  name: researcher
  version: v1

spec:
  goal: |
    Research the following question and provide a clear, detailed answer:

    {{question}}

    Search the web, fetch relevant pages for details, and synthesize
    your findings into a comprehensive summary when done.

  decision:
    type: llm
    provider: ollama
    model: qwen3:14b
    base_url: http://192.168.1.137:11434/v1

  inputs:
    question:
      type: string

  tools:
    - name: websearch
      type: websearch

  policy:
    mode: autonomous

    allowed_actions:
      - websearch:web_search
      - websearch:web_fetch

    constraints:
      max_actions: 8
