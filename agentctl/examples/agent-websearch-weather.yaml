apiVersion: agents/v1
kind: Agent

metadata:
  name: tarragona-weather
  version: v1

spec:
  goal: |
    Find the weather forecast for tomorrow in {{city}}.
    First search the web, then fetch the most relevant result page
    to get exact temperatures, conditions, and any weather alerts.
    Summarize the forecast clearly when done.

  decision:
    type: llm
    provider: ollama
    model: qwen3:14b
    base_url: http://192.168.1.138:11434/v1

  inputs:
    city:
      type: string
      default: "Tarragona, Spain"

  actions:
    tools:
      - websearch

  policy:
    constraints:
      max_actions: 5
