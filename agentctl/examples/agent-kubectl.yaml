apiVersion: agents/v1
kind: Agent

metadata:
  name: k8s-investigator
  version: v1

spec:
  goal: |
    Investigate the health of namespace "{{namespace}}".
    List pods, check for any that are not Running/Completed,
    and get logs or describe any unhealthy pods.
    Summarize your findings when done.

  decision:
    type: llm
    provider: ollama
    model: qwen3:14b
    base_url: http://192.168.1.138:11434/v1

  inputs:
    namespace:
      type: string
      default: default

  actions:
    collections:
      - k8s-readonly

  policy:
    constraints:
      max_actions: 10
